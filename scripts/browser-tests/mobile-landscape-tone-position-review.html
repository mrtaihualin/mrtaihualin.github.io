<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tone Position 2 review</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #ece7de; color: #49350d; font-family: system-ui, sans-serif; }
    body { display: grid; place-items: start center; width: 100%; padding: 18px; }
    main { width: 100%; max-width: 900px; min-width: 0; }
    h1 { margin: 0 0 10px; font-size: 17px; }
    .screen { width: 100%; max-width: 844px; aspect-ratio: 844 / 390; border: 1px solid #c9b27e; border-radius: 14px; overflow: hidden; background: #f5f0e8; box-shadow: 0 10px 28px rgba(73,53,13,.16); }
    iframe { display: block; width: 844px; height: 390px; border: 0; transform-origin: top left; }
    output { display: block; margin-top: 8px; font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Tone — ตำแหน่งปุ่ม 不確定 ที่ขนาด 844 × 390</h1>
    <div class="screen"><iframe id="game" title="Tone Mobile Landscape"></iframe></div>
    <output id="status">กำลังเปิดหน้า Tone…</output>
  </main>
  <script>
    (function () {
      'use strict';
      var frame = document.getElementById('game');
      var screen = frame.parentElement;
      var status = document.getElementById('status');
      function fitGame() {
        frame.style.transform = 'scale(' + Math.min(1, screen.clientWidth / 844) + ')';
      }
      fitGame();
      if (window.ResizeObserver) new ResizeObserver(fitGame).observe(screen);
      else window.addEventListener('resize', fitGame);
      var fixtureKeys = ['กิน@初','ไป@初','ดี@初#adjective','มา@初','บ้าน@初#noun-b-35'];
      var override = '<script>(function(){var keys=' + JSON.stringify(fixtureKeys) + ';window.GameContentLoader.boot=function(srcs){var chain=new Promise(function(resolve){if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",resolve,{once:true});else resolve();}).then(function(){return fetch("data/approved-vocabulary-catalog.json",{cache:"no-store"}).then(function(res){if(!res.ok)throw new Error("canonical fixture unavailable");return res.json();}).then(function(catalog){window.WORDS_MASTER=keys.map(function(key){var record=catalog.records.find(function(row){return row.contentKey===key;});if(!record)throw new Error("canonical fixture missing: "+key);return {catalog:record};});window.ADV_SENTENCES=[];});}).then(function(){if(window.GameResume&&typeof window.GameResume.load==="function")window.GameResume.load=function(){return null;};});(srcs||[]).forEach(function(src){chain=chain.then(function(){return new Promise(function(resolve,reject){var script=document.createElement("script");script.src=src;script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});});});return chain;};})();<\/script>';
      var clientTag = '<script src="' + 'js/games/game-content-client.js?v=13"><\/script>';

      fetch('../../tone-finder.html').then(function (response) {
        if (!response.ok) throw new Error('เปิดไฟล์ Tone ไม่สำเร็จ');
        return response.text();
      }).then(function (html) {
        html = html.replace('<head>', '<head><base href="' + new URL('../../', location.href).href + '">');
        html = html.replace(clientTag, clientTag + override);
        frame.onload = function () {
          var doc = frame.contentDocument;
          var started = Date.now();
          (function ready() {
            var skipTour = doc.querySelector('#gt-tour-card .gt-skip');
            if (skipTour && getComputedStyle(skipTour).display !== 'none') skipTour.click();
            var button = doc.querySelector('.sg-dontknow-btn[data-gsh-ml-position="2"]');
            if (doc.documentElement.classList.contains('gc-ready') && doc.body.classList.contains('gsh-ml-active') && button) {
              status.textContent = 'ตำแหน่งจริง — ปุ่ม 不確定 อยู่ล่างสุดของช่องขวา';
              return;
            }
            if (Date.now() - started > 15000) {
              status.textContent = 'เปิดหน้า Tone ไม่สำเร็จ';
              return;
            }
            setTimeout(ready, 80);
          })();
        };
        frame.srcdoc = html;
      }).catch(function (error) {
        status.textContent = error.message;
      });
    })();
  </script>
</body>
</html>
