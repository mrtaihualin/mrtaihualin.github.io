<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Five-game full-completion regression</title>
  <style>
    body { margin:0; padding:16px; font:14px/1.5 system-ui,sans-serif; background:#f5f0e8; color:#49350d; }
    h1 { margin:0 0 8px; font-size:20px; }
    #status { font-weight:800; }
    #results { white-space:pre-wrap; background:#fff; border:1px solid #d4b87a; border-radius:10px; padding:12px; }
    iframe { position:absolute; left:-10000px; top:0; border:0; }
  </style>
</head>
<body>
  <h1>Five-game full-completion regression</h1>
  <p id="status">RUNNING</p>
  <pre id="results"></pre>
  <iframe id="game" title="full game under test"></iframe>
  <script>
  (function () {
    'use strict';
    var games = [
      {page:'tone-finder.html', game:'tone'},
      {page:'reading-game.html', game:'reading'},
      {page:'typing-game.html', game:'typing'},
      {page:'word-order.html', game:'wordorder'},
      {page:'lego.html', game:'lego'}
    ];
    var modes = [
      {name:'Desktop', width:1440, height:900},
      {name:'Portrait', width:390, height:844},
      {name:'Landscape', width:844, height:390}
    ];
    var wordKeys = ['คุณ@初#pronoun-you-formal','ไป@初','เธอ@初#pronoun-you-peer','เลือก@初','ผม@初#noun-a-1','รีบ@初','นั่ง@初','หวัง@初','เรา@初#pronoun-i-we-you','เขา@初#noun-a-2','มา@初','ให้@初','อยู่@初','เดิน@初','คืน@初','จำ@初','ทำ@初','สร้าง@初','เปลี่ยน@初','ผิดหวัง@中','ตื่นเต้น@中','มั่นใจ@中','ไว้ใจ@中','สงสาร@中'];
    var frame = document.getElementById('game');
    var status = document.getElementById('status');
    var results = document.getElementById('results');
    var lines = [];

    function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
    async function waitFor(check, message, timeout) {
      var started = Date.now();
      while (Date.now() - started < (timeout || 20000)) {
        try { if (check()) return; } catch (ignore) {}
        await wait(30);
      }
      throw new Error('timeout: ' + message);
    }
    function shown(win, node) {
      if (!node || node.hidden) return false;
      var style = win.getComputedStyle(node);
      return style.display !== 'none' && style.visibility !== 'hidden' && node.getClientRects().length > 0;
    }
    function assert(value, message) { if (!value) throw new Error(message); }
    function earlyOverride(game) {
      return '<script>(function(){window.__fullTestErrors=[];window.addEventListener("error",function(event){var message=event.message||(event.error&&event.error.message);if(message)window.__fullTestErrors.push(String(message));},true);try{localStorage.clear();sessionStorage.clear();localStorage.setItem("cookieConsent","denied");localStorage.setItem("howto_tour_seen_' + game + '","1");localStorage.setItem("howto_hint_seen_' + game + '","1");}catch(e){}var seed=173;Math.random=function(){seed=(seed*9301+49297)%233280;return seed/233280;};})();<\/script>';
    }
    function contentOverride() {
      return '<script>(function(){var keys=' + JSON.stringify(wordKeys) + ';window.GameContentLoader.boot=function(srcs){var chain=new Promise(function(resolve){if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",resolve,{once:true});else resolve();}).then(function(){return fetch("data/approved-vocabulary-catalog.json",{cache:"no-store"}).then(function(res){if(!res.ok)throw new Error("canonical fixture unavailable");return res.json();}).then(function(catalog){window.WORDS_MASTER=keys.map(function(key){var record=catalog.records.find(function(row){return row.contentKey===key;});if(!record)throw new Error("canonical fixture missing: "+key);return {catalog:record};});});}).then(function(){return new Promise(function(resolve,reject){var script=document.createElement("script");script.src=["data/adv-sentences.js","v=2"].join("?");script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});}).then(function(){if(window.GameResume&&typeof window.GameResume.load==="function")window.GameResume.load=function(){return null;};});(srcs||[]).forEach(function(src){chain=chain.then(function(){return new Promise(function(resolve,reject){var script=document.createElement("script");script.src=src;script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});});});return chain;};})();<\/script>';
    }
    function ready(config, doc) {
      if (config.game === 'tone') return doc.querySelector('.sg-tone-grid') && doc.getElementById('tf-banner').textContent.trim();
      if (config.game === 'reading' || config.game === 'typing') return doc.getElementById('wth').textContent.trim() !== '—' && doc.querySelector('#pool .opt');
      if (config.game === 'wordorder') return doc.querySelector('#wo-slots > *') && doc.querySelector('#wo-bank .wo-tile');
      return doc.querySelector('.slot[data-id="subj"]') && doc.querySelector('.slot[data-id="verb"]');
    }
    async function load(config, mode) {
      frame.style.width = mode.width + 'px';
      frame.style.height = mode.height + 'px';
      var response = await fetch('../../' + config.page + '?full-completion=' + Date.now(), {cache:'no-store'});
      if (!response.ok) throw new Error(config.page + ' source load failed');
      var html = await response.text();
      html = html.replace('<head>', '<head><base href="' + new URL('../../', location.href).href + '">' + earlyOverride(config.game));
      html = html.replace(/game-content-client\.js\?v=\d+"><\/script>/, function (tag) { return tag + contentOverride(); });
      await new Promise(function (resolve, reject) {
        var timer = setTimeout(function () { reject(new Error(config.page + ' iframe load timeout')); }, 25000);
        frame.onload = function () { clearTimeout(timer); resolve(); };
        frame.srcdoc = html;
      });
      var view = {doc:frame.contentDocument, win:frame.contentWindow};
      try { await waitFor(function () { return ready(config, view.doc); }, config.page + ' playable entry', 25000); }
      catch (error) {
        throw new Error(error.message + ' | runtime=' + JSON.stringify(view.win.__fullTestErrors || []));
      }
      var tour = view.doc.getElementById('gt-tour-card');
      assert(!tour || !shown(view.win, tour), config.page + ' tutorial must not repeat after seen');
      return view;
    }

    async function answerTone(view) {
      var correct = view.win.catalogToneNumber();
      var buttons = view.doc.querySelectorAll('.sg-tone-btn');
      assert(correct >= 1 && correct <= 5 && buttons.length === 5, 'Tone answer controls unavailable');
      buttons[correct - 1].click();
      await waitFor(function () { return shown(view.win, view.doc.getElementById('tf-session-next-btn')); }, 'Tone correct answer result');
      view.doc.getElementById('tf-session-next-btn').click();
      await wait(50);
    }
    async function toneWaitForResult(view, message) {
      await waitFor(function () {
        return view.win.S && view.win.S.step === 'result' && shown(view.win, view.doc.getElementById('tf-session-next-btn'));
      }, message || 'Tone result');
    }
    async function toneClickCorrectChoice(view) {
      var expected = view.win.catalogExpectedTeachingChoice(view.win.S.step);
      var choices = Array.prototype.slice.call(view.doc.querySelectorAll('[data-hintkey]'));
      var correct = choices.filter(function (button) { return button.getAttribute('data-hintkey') === expected; });
      assert(correct.length === 1, 'Tone teaching choice must resolve to exactly one reviewed option at ' + view.win.S.step);
      correct[0].click();
      await wait(20);
    }
    async function toneFinishCleanDerivation(view) {
      for (var guard = 0; guard < 12 && view.win.S.step !== 'result'; guard += 1) await toneClickCorrectChoice(view);
      await toneWaitForResult(view, 'Tone clean derivation result');
    }
    async function toneChooseWrongInitial(view) {
      var correct = view.win.catalogToneNumber();
      var buttons = view.doc.querySelectorAll('.sg-tone-btn');
      assert(buttons.length === 5, 'Tone initial choices unavailable');
      buttons[correct % 5].click();
      await waitFor(function () { return view.win.S.step !== 'session-guess'; }, 'Tone teaching flow after initial guess');
    }
    async function toneNext(view) {
      view.doc.getElementById('tf-session-next-btn').click();
      await waitFor(function () { return view.win.S && view.win.S.step !== 'result'; }, 'Tone next unit');
    }
    async function verifyToneGameplayRules() {
      var view = await load({page:'tone-finder.html', game:'tone'}, modes[0]);
      var win = view.win;

      win.session.currentWordGolden = false;
      view.doc.querySelectorAll('.sg-tone-btn')[win.catalogToneNumber() - 1].click();
      await toneWaitForResult(view, 'Tone first clean answer');
      assert(win.session.combo === 1 && win.session.currentWordScore === 10, 'Tone clean answer must start Combo and score 10');
      await toneNext(view);

      win.session.currentWordGolden = false;
      await toneChooseWrongInitial(view);
      await toneFinishCleanDerivation(view);
      assert(win.session.combo === 2, 'Tone wrong initial guess plus clean derivation must preserve and grow Combo');
      assert(win.session.currentWordFirstTry === true, 'Tone wrong initial guess plus clean derivation must keep Clean eligibility');
      assert(win.session.currentWordScore === 10, 'Tone wrong initial guess plus clean derivation must keep full score');
      await toneNext(view);

      win.session.currentWordGolden = true;
      var guideToggle = view.doc.getElementById('tf-guide-toggle');
      assert(guideToggle, 'Tone Hint toggle unavailable');
      guideToggle.click();
      await waitFor(function () { return win.tfGuideMode && win.session.currentWordGuideUsed; }, 'Tone Free Practice activation');
      assert(win.session.currentWordGolden === false, 'Tone Free Practice must remove Golden eligibility');
      assert(!view.doc.querySelector('.tf-golden-hud') && !view.doc.querySelector('.tf-banner-word-gold'), 'Tone Free Practice must remove Golden presentation');
      var guideStart = view.doc.getElementById('tf-guide-start-btn');
      assert(guideStart, 'Tone guided start unavailable');
      guideStart.click();
      await toneFinishCleanDerivation(view);
      assert(win.session.currentWordScore === 0, 'Tone Free Practice word must score 0');
      assert(win.session.combo === 2, 'Tone Free Practice must not change Combo');
      await toneNext(view);
      assert(win.tfGuideMode === false && win.session.currentWordGuideUsed === false, 'Tone next word must return to Challenge with Hint off');
      assert(win.session.combo === 2, 'Tone next word must retain Combo after Free Practice');

      win.session.currentWordGolden = false;
      await toneChooseWrongInitial(view);
      var expected = win.catalogExpectedTeachingChoice(win.S.step);
      var wrong = Array.prototype.slice.call(view.doc.querySelectorAll('[data-hintkey]')).filter(function (button) {
        return button.getAttribute('data-hintkey') !== expected;
      })[0];
      assert(wrong, 'Tone wrong derivation choice unavailable');
      wrong.click();
      await wait(20);
      await toneFinishCleanDerivation(view);
      assert(win.session.currentWordScore === 7, 'Tone first real derivation mistake must reduce score to 7');
      assert(win.session.combo === 0, 'Tone real derivation mistake must reset Combo');
      await toneNext(view);

      win.session.currentWordGolden = false;
      view.doc.querySelectorAll('.sg-tone-btn')[win.catalogToneNumber() - 1].click();
      await toneWaitForResult(view, 'Tone fifth answer');
      await toneNext(view);
      assert(win.S.step === 'session-summary', 'Tone initial round must reach Result after five words');
      assert(win.session.results.length === 5, 'Tone Free Practice must still count toward the five-word round');
      assert(win.session.bonusAwarded === 0, 'Tone round containing Free Practice must receive no +20/+50 bonus');
      assert(win.session.results[1].firstTry === true, 'Tone clean teaching route must remain Clean in Result evidence');
      assert(win.session.results[2].hintUsed === true && win.session.results[2].needReview === false, 'Tone Free Practice must stay out of Retry/Review');
      assert(win.session.results[2].golden === false, 'Tone Free Practice must not retain Golden evidence');
      assert(win.roundReport.items[2].is_practice === true && win.roundReport.items[2].is_correct === false, 'Tone Free Practice must be explicit neutral report evidence');
      assert(win.roundReport.wrong_count === 1, 'Tone Free Practice must not increase the round wrong count');
      var freePracticeSummaryRow = view.doc.querySelectorAll('.tf-sum-table tbody tr')[2];
      assert(freePracticeSummaryRow && freePracticeSummaryRow.textContent.indexOf('純練習') !== -1 && freePracticeSummaryRow.textContent.indexOf('✗') === -1, 'Tone Result must label Free Practice without a wrong mark');
      win.TF.showMistakeReview();
      await waitFor(function () { return win.S.step === 'mistake-review'; }, 'Tone detail report');
      var freePracticeDetail = view.doc.querySelectorAll('.gsh-mistake-item')[2];
      assert(freePracticeDetail && freePracticeDetail.textContent.indexOf('狀態：純練習') !== -1 && !freePracticeDetail.classList.contains('gsh-mistake-wrong'), 'Tone detail report must keep Free Practice neutral');
      win.TF.backToMistakeSummary();
      await waitFor(function () { return win.S.step === 'session-summary'; }, 'Tone return from detail report');

      win.TF.selectLevel(2);
      await waitFor(function () { return win.selectedLevel === 2 && win.S.step === 'session-guess'; }, 'Tone intermediate round');
      for (var step = 0; step < 30 && win.S.step !== 'session-summary'; step += 1) {
        win.session.currentWordGolden = false;
        var correctTone = win.catalogToneNumber();
        view.doc.querySelectorAll('.sg-tone-btn')[correctTone - 1].click();
        await toneWaitForResult(view, 'Tone intermediate syllable result');
        await toneNext(view);
      }
      assert(win.S.step === 'session-summary', 'Tone intermediate round must complete every syllable of five words');
      assert(win.session.results.length === 5, 'Tone intermediate round must commit five whole words, not separate syllable rows');
      assert(win.session.results.every(function (row) { return row.firstTry && row.score > 0; }), 'Tone clean intermediate words must all remain Clean and scored');
      assert(win.session.bonusAwarded === 70, 'Tone clean intermediate round must keep +20/+50 bonuses');

      for (var hintLevel = 1; hintLevel <= 2; hintLevel += 1) {
        var hintView = await load({page:'tone-finder.html', game:'tone'}, modes[0]);
        var hintWin = hintView.win;
        if (hintLevel === 2) {
          hintWin.TF.selectLevel(2);
          await waitFor(function () { return hintWin.selectedLevel === 2 && hintWin.S.step === 'session-guess'; }, 'Tone intermediate Hint regression setup');
        }
        hintWin.session.currentWordGolden = true;
        hintWin.render();
        await toneChooseWrongInitial(hintView);
        assert(hintView.doc.querySelector('.tf-golden-hud') && hintView.doc.querySelector('.tf-banner-word-gold'), 'Tone Golden presentation precondition missing for Hint level ' + hintLevel);
        var tipButton = hintView.doc.querySelector('.tf-tip-btn');
        assert(tipButton, 'Tone ? Hint button unavailable for level ' + hintLevel);
        tipButton.click();
        await waitFor(function () { return hintWin.session.currentWordGuideUsed && hintWin.session.hintUsed; }, 'Tone ? Hint activation level ' + hintLevel);
        assert(hintWin.session.currentWordGolden === false, 'Tone ? Hint must remove Golden state for level ' + hintLevel);
        assert(!hintView.doc.querySelector('.tf-golden-hud') && !hintView.doc.querySelector('.tf-banner-word-gold'), 'Tone ? Hint must immediately remove Golden presentation for level ' + hintLevel);
      }

      var rapidSkipView = await load({page:'tone-finder.html', game:'tone'}, modes[0]);
      var rapidSkipWin = rapidSkipView.win;
      var rapidSkipStartIndex = rapidSkipWin.session.index;
      var rapidSkipStartResults = rapidSkipWin.session.results.length;
      rapidSkipWin.TF.skipCurrentWord();
      rapidSkipWin.TF.skipCurrentWord();
      await waitFor(function () { return rapidSkipWin.session.index === rapidSkipStartIndex + 1; }, 'Tone rapid double Skip advances once');
      assert(rapidSkipWin.session.results.length === rapidSkipStartResults + 1, 'Tone rapid double Skip must record one neutral result');
      await wait(520);
      rapidSkipWin.TF.skipCurrentWord();
      await waitFor(function () { return rapidSkipWin.session.index === rapidSkipStartIndex + 2; }, 'Tone later intentional Skip remains available');
      assert(rapidSkipWin.session.results.length === rapidSkipStartResults + 2, 'Tone later intentional Skip must record the next neutral result');

      assert((win.__fullTestErrors || []).length === 0, 'Tone gameplay rule runtime errors: ' + JSON.stringify(win.__fullTestErrors || []));
      lines.push('PASS tone-finder.html — 初/中 — clean teaching/Free Practice/mistake ladder/five-word bonuses');
      results.textContent = lines.join('\n');
    }
    async function finishTone(view) {
      await answerTone(view);
      for (var count = 0; count < 12 && !view.doc.querySelector('[data-game-result-replay="v1"]'); count += 1) {
        view.win.TF.skipCurrentWord();
        await wait(520);
      }
      var replay = view.doc.querySelector('[data-game-result-replay="v1"]');
      assert(replay && shown(view.win, replay), 'Tone Result/replay missing');
      replay.click();
      await waitFor(function () { return shown(view.win, view.doc.querySelector('.sg-tone-grid')); }, 'Tone replay');
    }

    function fillCorrectTiles(view) {
      view.win.comps.forEach(function (component) {
        var tile = view.win.optTiles.filter(function (item) { return item.val === view.win.correctVal[component]; })[0];
        if (!tile) throw new Error('correct tile missing for ' + component);
        var node = view.doc.querySelector('#pool .opt[data-id="' + tile.id + '"]');
        if (!node) throw new Error('correct tile node missing for ' + component);
        node.click();
      });
    }
    async function finishPhonics(view, game) {
      fillCorrectTiles(view);
      var check = view.doc.getElementById('btn-check');
      assert(check && !check.disabled, game + ' Check unavailable after answer');
      check.click();
      await waitFor(function () { return shown(view.win, view.doc.getElementById('btn-next')); }, game + ' correct answer Next');
      view.doc.getElementById('btn-next').click();
      await wait(50);
      for (var count = 0; count < 12 && !shown(view.win, view.doc.getElementById('end')); count += 1) {
        view.win.skipWord();
        await wait(50);
      }
      assert(shown(view.win, view.doc.getElementById('end')), game + ' Result missing');
      var replay = view.doc.querySelector('[data-game-result-replay="v1"]');
      assert(replay && shown(view.win, replay), game + ' replay missing');
      replay.click();
      await waitFor(function () { return shown(view.win, view.doc.getElementById('game')); }, game + ' replay');
    }

    async function finishTyping(view) {
      var target = view.win.RG_TYPE && view.win.RG_TYPE.target;
      assert(target && typeof view.win.rgTypeChar === 'function', 'Typing Thai input target unavailable');
      assert(view.win.correctVal && view.win.correctVal.vowel, 'Typing canonical vowel unavailable');
      Array.from(target).forEach(function (character) { view.win.rgTypeChar(character); });
      await waitFor(function () { return shown(view.win, view.doc.getElementById('btn-next')); }, 'Typing complete Thai input Next');
      view.doc.dispatchEvent(new view.win.KeyboardEvent('keydown', {key:'Enter', code:'Enter', bubbles:true}));
      await waitFor(function () { return !view.win.checked; }, 'Typing Enter advances to next question');
      for (var count = 0; count < 12 && !shown(view.win, view.doc.getElementById('end')); count += 1) {
        view.win.skipWord();
        await wait(50);
      }
      assert(shown(view.win, view.doc.getElementById('end')), 'Typing Result missing');
      var replay = view.doc.querySelector('[data-game-result-replay="v1"]');
      assert(replay && shown(view.win, replay), 'Typing replay missing');
      replay.click();
      await waitFor(function () { return shown(view.win, view.doc.getElementById('game')); }, 'Typing replay');
    }

    async function finishWordOrder(view) {
      var wordCount = view.doc.querySelectorAll('#wo-slots .wo-slot').length;
      assert(wordCount > 1, 'Word Order answer slots unavailable');
      for (var original = 0; original < wordCount; original += 1) {
        var tile = view.doc.querySelector('#wo-bank .wo-tile[data-gsh-original-index="' + original + '"]');
        assert(tile, 'Word Order canonical tile missing');
        tile.click();
        await wait(20);
      }
      await waitFor(function () { return !view.doc.getElementById('wo-next-btn').disabled; }, 'Word Order correct answer Next');
      view.doc.getElementById('wo-next-btn').click();
      await wait(50);
      for (var count = 0; count < 12 && !shown(view.win, view.doc.getElementById('end')); count += 1) {
        view.win.woSkip();
        await wait(50);
      }
      assert(shown(view.win, view.doc.getElementById('end')), 'Word Order Result missing');
      var replay = view.doc.getElementById('wo-replay-btn');
      assert(replay && shown(view.win, replay), 'Word Order replay missing');
      replay.click();
      await waitFor(function () { return shown(view.win, view.doc.getElementById('game')); }, 'Word Order replay');
    }

    async function chooseLego(view, slotId) {
      var slot = view.doc.querySelector('.slot[data-id="' + slotId + '"]');
      assert(slot, 'Lego ' + slotId + ' slot missing');
      slot.querySelector('.slot-btn').click();
      await waitFor(function () {
        var current = view.doc.querySelector('.slot[data-id="' + slotId + '"]');
        return current && current.classList.contains('menu-open') && current.querySelector('.opt[role="button"]');
      }, 'Lego ' + slotId + ' options');
      view.doc.querySelector('.slot[data-id="' + slotId + '"] .opt[role="button"]').click();
      await wait(40);
    }
    async function finishLego(view) {
      await chooseLego(view, 'subj');
      await chooseLego(view, 'verb');
      // The current central catalog can legitimately expose no location choice for the
      // first selected verb. Subject and verb are the only required Lego slots, so the
      // completion regression must not turn an empty optional pool into a false failure.
      view.win.legoCompleteSentence();
      await waitFor(function () { return !view.doc.getElementById('lego-reveal').classList.contains('hidden'); }, 'Lego answer reveal');
      view.win.legoEndGame();
      await waitFor(function () { return !view.doc.getElementById('lego-result').classList.contains('hidden'); }, 'Lego Result');
      var replay = view.doc.querySelector('#lego-result [data-game-result-replay="v1"]');
      assert(replay && shown(view.win, replay), 'Lego replay missing');
      replay.click();
      await waitFor(function () { return !view.doc.getElementById('buildPanel').classList.contains('hidden'); }, 'Lego new round');
    }

    async function complete(config, mode) {
      var view = await load(config, mode);
      if (config.game === 'tone') await finishTone(view);
      else if (config.game === 'reading') await finishPhonics(view, config.game);
      else if (config.game === 'typing') await finishTyping(view);
      else if (config.game === 'wordorder') await finishWordOrder(view);
      else await finishLego(view);
      assert((view.win.__fullTestErrors || []).length === 0, config.page + ' runtime errors: ' + JSON.stringify(view.win.__fullTestErrors || []));
      lines.push('PASS ' + config.page + ' — ' + mode.name + ' — entry/answer/skip/next/Result/replay');
      results.textContent = lines.join('\n');
    }

    (async function () {
      try {
        await verifyToneGameplayRules();
        for (var gameIndex = 0; gameIndex < games.length; gameIndex += 1) {
          for (var modeIndex = 0; modeIndex < modes.length; modeIndex += 1) {
            await complete(games[gameIndex], modes[modeIndex]);
          }
        }
        status.textContent = 'PASS 15/15 full completions';
        status.dataset.result = 'pass';
        document.title = 'PASS — Five-game full-completion regression';
      } catch (error) {
        lines.push('FAIL ' + (error && error.stack ? error.stack : error));
        results.textContent = lines.join('\n');
        status.textContent = 'FAIL after ' + lines.filter(function (line) { return line.indexOf('PASS ') === 0; }).length + ' completions';
        status.dataset.result = 'fail';
        document.title = 'FAIL — Five-game full-completion regression';
      }
    })();
  })();
  </script>
</body>
</html>
