<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reading Mobile Landscape review</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #ece7de; color: #49350d; font-family: system-ui, sans-serif; }
    body { display: grid; place-items: start center; width: 100%; padding: 18px; }
    main { width: 100%; max-width: 900px; min-width: 0; }
    h1 { margin: 0 0 10px; font-size: 17px; }
    .screen { width: 100%; max-width: 844px; aspect-ratio: 844 / 390; border: 1px solid #c9b27e; border-radius: 14px; overflow: hidden; background: #f5f0e8; box-shadow: 0 10px 28px rgba(73,53,13,.16); }
    iframe { display: block; width: 844px; height: 390px; border: 0; transform-origin: top left; }
    output { display: block; margin-top: 8px; font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Reading — หน้าเกมจริงขนาด 844 × 390</h1>
    <div class="screen"><iframe id="game" title="Reading Mobile Landscape"></iframe></div>
    <output id="status">กำลังเปิดหน้า Reading…</output>
  </main>
  <script>
    (function () {
      'use strict';
      var frame = document.getElementById('game');
      var screen = frame.parentElement;
      var status = document.getElementById('status');
      var requestedSurface = new URLSearchParams(location.search).get('surface') || 'landscape';
      var surfaceSize = requestedSurface === 'desktop'
        ? { width: 1024, height: 768, label: 'คอม' }
        : requestedSurface === 'portrait'
          ? { width: 390, height: 844, label: 'มือถือแนวตั้ง' }
          : { width: 844, height: 390, label: 'มือถือแนวนอน' };
      var requestedReview = new URLSearchParams(location.search).get('review') || '';
      var requestedLayoutMatch = requestedReview.match(/([1-3])$/);
      var requestedLayout = requestedLayoutMatch ? Number(requestedLayoutMatch[1]) : 1;
      frame.style.width = surfaceSize.width + 'px';
      frame.style.height = surfaceSize.height + 'px';
      document.querySelector('main').style.maxWidth = surfaceSize.width + 'px';
      screen.style.maxWidth = surfaceSize.width + 'px';
      screen.style.aspectRatio = surfaceSize.width + ' / ' + surfaceSize.height;
      document.querySelector('h1').textContent = 'Reading — ' + surfaceSize.label + ' ' + surfaceSize.width + ' × ' + surfaceSize.height;
      function fitGame() {
        frame.style.transform = 'scale(' + Math.min(1, screen.clientWidth / surfaceSize.width) + ')';
      }
      fitGame();
      if (window.ResizeObserver) new ResizeObserver(fitGame).observe(screen);
      else window.addEventListener('resize', fitGame);
      var fixture = [
        {word:'หนึ่ง',en:'nèung',zh:'一',level:'初',category:'ตัวเลข',syls:[{cons:'น',lead:'ห',vowel:'อึ',tone:'่',final:'ง',tone_name:'เอก',th:'หนึ่ง'}]},
        {word:'กิน',en:'gin',zh:'吃',level:'初',category:'กริยา',syls:[{cons:'ก',vowel:'อิ',final:'น',tone_name:'สามัญ',th:'กิน'}]},
        {word:'ไป',en:'bpai',zh:'去',level:'初',category:'กริยา',syls:[{cons:'ป',vowel:'ไอ',tone_name:'สามัญ',th:'ไป'}]},
        {word:'ดี',en:'dii',zh:'好',level:'初',category:'คำขยาย',syls:[{cons:'ด',vowel:'อี',tone_name:'สามัญ',th:'ดี'}]},
        {word:'บ้าน',en:'bâan',zh:'家',level:'初',category:'สถานที่',syls:[{cons:'บ',vowel:'อา',tone:'้',final:'น',tone_name:'โท',th:'บ้าน'}]}
      ];
      var previewFixture = [fixture[0]];
      var override = '<script>(function(){var rows=' + JSON.stringify(previewFixture) + ';var seed=173;Math.random=function(){seed=(seed*9301+49297)%233280;return seed/233280;};window.__GSH_ML_READING_LAYOUT_PREVIEW=' + requestedLayout + ';window.GameContentLoader.boot=function(srcs){window.WORDS_MASTER=rows;window.ADV_SENTENCES=[];var chain=new Promise(function(resolve){if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",resolve,{once:true});else resolve();}).then(function(){if(window.GameResume&&typeof window.GameResume.load==="function")window.GameResume.load=function(){return null;};});(srcs||[]).forEach(function(src){chain=chain.then(function(){return new Promise(function(resolve,reject){var script=document.createElement("script");script.src=src;script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});});});return chain;};})();<\/script>';
      var clientTag = '<script src="' + 'js/games/game-content-client.js?v=13"><\/script>';

      fetch('../../reading-game.html?review-cache=' + Date.now(), {cache:'no-store'}).then(function (response) {
        if (!response.ok) throw new Error('เปิดไฟล์ Reading ไม่สำเร็จ');
        return response.text();
      }).then(function (html) {
        html = html.replace('<head>', '<head><base href="../../">');
        html = html.replace(clientTag, clientTag + override);
        frame.onload = function () {
          var doc = frame.contentDocument;
          var started = Date.now();
          (function ready() {
            var surfaceReady = requestedSurface === 'landscape'
              ? doc.body.classList.contains('gsh-ml-active')
              : !doc.body.classList.contains('gsh-ml-active');
            if (doc.documentElement.classList.contains('gc-ready') && surfaceReady) {
              status.textContent = 'พร้อมตรวจ ' + surfaceSize.label + ' แบบ ' + requestedLayout + ' — ใช้หน้า Reading และปุ่มจริงจากไฟล์เกม';
              return;
            }
            if (Date.now() - started > 15000) {
              status.textContent = 'เปิดหน้า Reading ไม่สำเร็จ';
              return;
            }
            setTimeout(ready, 80);
          })();
        };
        frame.srcdoc = html;
      }).catch(function (error) {
        status.textContent = error.message;
      });
    })();
  </script>
</body>
</html>
