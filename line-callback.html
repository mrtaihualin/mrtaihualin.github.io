<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>登入中… | 泰華眼裡的泰語教學</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><!-- Lin 2026-07-26: เปิดสายไปที่เซิร์ฟเวอร์ฟอนต์ล่วงหน้า ลดเวลารอบนมือถือ -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#8B6310; --gold-bright:#C8973A; --gold-light:#F3E4C2; --gold-deep:#5a3e0a;
    --ink:#1C1C1C; --ink-soft:#333333; --ink-muted:#6b6b6b;
    --bg:#EDE7D9; --cream:#FAF4E8; --border:rgba(139,99,16,0.18);
  }
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);font-family:'Noto Sans TC',sans-serif;color:var(--ink);padding:20px;box-sizing:border-box;}
  .box{background:var(--cream);border:1px solid var(--border);border-radius:18px;padding:36px 30px;
    max-width:340px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08);}
  .spin{width:38px;height:38px;border:4px solid var(--gold-light);border-top-color:var(--gold-bright);
    border-radius:50%;margin:0 auto 16px;animation:sp 0.8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  h1{font-family:'Noto Serif TC',serif;font-size:17px;margin:0 0 8px;color:var(--gold-deep);}
  p{font-size:13.5px;color:var(--ink-muted);line-height:1.6;margin:0;}
  a.btn{display:inline-block;margin-top:16px;background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));
    color:#fff;text-decoration:none;padding:10px 22px;border-radius:20px;font-size:13.5px;font-weight:700;}
</style>
</head>
<body>
<div class="box" id="line-cb-box">
  <div class="spin"></div>
  <h1>登入中…</h1>
  <p>正在跟 LINE 確認身份，請稍候</p>
</div>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="js/core/supabase-config.js?v=5"></script>
<script defer src="js/games/line-callback.js?v=1"></script>
</body>
</html>
