<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>บัญชีผู้เล่น — หน้าแอดมิน (ใช้ส่วนตัว ไม่ต้องแชร์)</title>
<style>
  :root{--gold:#8B6310;--gold-bright:#C8973A;--gold-light:#F3E4C2;--gold-deep:#5a3e0a;--ink:#1C1C1C;--ink-soft:#333333;--ink-muted:#6b6b6b;--bg:#EDE7D9;--cream:#FAF4E8;--border:rgba(139,99,16,0.18);--green:#2d6a4f;--green-dark:#1b4332;--amber:#b45309;--amber-dark:#78350f;--amber-muted:#92400e;}
  *{box-sizing:border-box;}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:24px 16px 60px;}
  h1{font-family:'Noto Serif TC',serif;color:var(--gold-deep);font-size:22px;margin:0 0 4px;}
  h2{font-family:'Noto Serif TC',serif;color:var(--gold-deep);font-size:16px;margin:24px 0 10px;}
  p.sub{color:var(--ink-muted);font-size:13px;margin:0 0 20px;}
  .keybar{display:flex;gap:8px;margin-bottom:12px;max-width:640px;flex-wrap:wrap;}
  .keybar input{flex:1;min-width:180px;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;}
  .keybar select{border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;background:#fff;}
  .keybar button{border:none;border-radius:10px;padding:9px 16px;background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));color:#fff;font-weight:700;font-size:13px;cursor:pointer;}
  .keybar button.secondary{background:#fff;color:var(--gold-deep);border:1.5px solid var(--border);}
  .card{background:var(--cream);border:1.5px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px;max-width:720px;}
  .card .meta{font-size:12px;color:var(--ink-muted);margin-bottom:6px;}
  .card .title{font-size:15px;font-weight:700;margin-bottom:6px;}
  .tag{display:inline-block;font-size:11px;border-radius:999px;padding:2px 9px;margin:2px 4px 2px 0;background:var(--gold-light);color:var(--gold-deep);font-weight:700;}
  .tag.warn{background:#fde68a;color:var(--amber-dark);}
  .tag.dup{background:#fecaca;color:#7f1d1d;}
  .btn{border:none;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-view{background:var(--green);color:#fff;}
  .btn-note{background:#fff;color:var(--amber-dark);border:1.5px solid var(--amber);}
  .empty{color:var(--ink-muted);font-size:14px;padding:16px 0;}
  .status{font-size:12px;margin-top:8px;color:var(--ink-muted);}
  table{border-collapse:collapse;width:100%;max-width:720px;font-size:13px;}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);}
  th{color:var(--ink-muted);font-weight:700;font-size:12px;}
  .noteBox{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
  .noteBox textarea{flex:1;min-width:220px;border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit;min-height:44px;}
  #detail{max-width:720px;}
  .section{margin-bottom:14px;}
</style>
</head>
<body>
  <h1>🔍 ค้นหา/ดูบัญชีผู้เล่น</h1>
  <p class="sub">หน้านี้ใช้ส่วนตัวเท่านั้น ไม่ต้องแชร์ลิงก์ให้ใคร — ต้องใส่ ADMIN_PLAYER_ACCOUNTS_KEY (ตั้งไว้ตอน deploy Edge Function <code>admin-player-accounts</code> — คนละคีย์กับหน้าแจ้งปัญหาเกม) ก่อนถึงจะใช้ได้</p>

  <div class="keybar">
    <input id="edge-url" placeholder="Edge Function URL เช่น https://xxxx.supabase.co/functions/v1/admin-player-accounts" />
  </div>
  <div class="keybar">
    <input id="admin-key" type="password" placeholder="ADMIN_PLAYER_ACCOUNTS_KEY" />
    <button class="secondary" onclick="apaSaveKeys()">บันทึกคีย์</button>
  </div>

  <h2>ค้นหาบัญชี</h2>
  <div class="keybar">
    <select id="query-type">
      <option value="email">อีเมล</option>
      <option value="nickname">ชื่อเล่นในเกม</option>
      <option value="line_user_id">LINE user id</option>
      <option value="user_id">user_id (uuid เป๊ะ)</option>
    </select>
    <input id="query-value" placeholder="พิมพ์คำค้น..." />
    <button onclick="apaSearch()">ค้นหา</button>
  </div>
  <div id="search-results"></div>

  <h2>บัญชีที่อาจซ้ำกัน</h2>
  <div class="keybar">
    <button class="secondary" onclick="apaLoadDuplicates()">โหลดรายการบัญชีที่อาจซ้ำ (สแกนสดตอนกด อาจใช้เวลาสักครู่)</button>
  </div>
  <div id="dup-results"></div>

  <h2 id="detail-title" style="display:none;">รายละเอียดบัญชี</h2>
  <div id="detail"></div>

<script>
function apaKeys(){
  return { url: document.getElementById('edge-url').value.trim(), key: document.getElementById('admin-key').value.trim() };
}
function apaSaved(){
  try{
    var u=localStorage.getItem('apa_edge_url'); var k=localStorage.getItem('apa_admin_key');
    if(u) document.getElementById('edge-url').value=u;
    if(k) document.getElementById('admin-key').value=k;
  }catch(e){}
}
apaSaved();

function apaSaveKeys(){
  var k=apaKeys();
  if(!k.url||!k.key){ alert('กรอก URL กับ admin key ก่อน'); return; }
  try{ localStorage.setItem('apa_edge_url',k.url); localStorage.setItem('apa_admin_key',k.key); }catch(e){}
  alert('บันทึกแล้ว');
}

function apaCall(action, payload){
  var k=apaKeys();
  if(!k.url||!k.key){ alert('กรอก URL กับ admin key ก่อน'); return Promise.reject(new Error('missing keys')); }
  return fetch(k.url, {
    method:'POST',
    headers:{'Content-Type':'application/json','x-admin-key':k.key},
    body:JSON.stringify(Object.assign({action:action}, payload||{}))
  }).then(function(r){ return r.json(); });
}

function apaEsc(s){
  var d=document.createElement('div'); d.textContent=(s===null||s===undefined)?'':String(s); return d.innerHTML;
}

function apaAccountCard(acc){
  var div=document.createElement('div'); div.className='card';
  var methodsHtml = (acc.login_methods||[]).map(function(m){ return '<span class="tag">'+apaEsc(m.provider)+'</span>'; }).join('');
  if(acc.has_synthetic_line_email){ methodsHtml += '<span class="tag warn">มีอีเมลปลอมของ LINE</span>'; }
  div.innerHTML =
    '<div class="title">'+apaEsc(acc.nickname||'(ไม่มีชื่อเล่น)')+'</div>'+
    '<div class="meta">user_id: '+apaEsc(acc.user_id)+'<br>อีเมล: '+apaEsc(acc.email||'(ไม่มี)')+' · สมัครเมื่อ '+(acc.created_at?new Date(acc.created_at).toLocaleString('zh-TW'):'-')+'</div>'+
    '<div class="meta">⭐ '+apaEsc(acc.stars)+' · streak '+apaEsc(acc.streak)+' · ช่องทางล็อกอินจริง: '+apaEsc(acc.real_method_count)+'</div>'+
    '<div>'+methodsHtml+'</div>'+
    '<div style="margin-top:10px;"><button class="btn btn-view">ดูรายละเอียด + ประวัติ</button></div>';
  div.querySelector('.btn-view').onclick=function(){ apaLoadDetail(acc.user_id); };
  return div;
}

function apaSearch(){
  var qType=document.getElementById('query-type').value;
  var qVal=document.getElementById('query-value').value.trim();
  var box=document.getElementById('search-results');
  if(!qVal){ alert('พิมพ์คำค้นก่อน'); return; }
  box.innerHTML='<div class="empty">กำลังค้นหา...</div>';
  apaCall('search_accounts', {query_type:qType, query:qVal}).then(function(data){
    if(data.error){ box.innerHTML='<div class="empty">ค้นหาไม่สำเร็จ: '+apaEsc(data.error)+' '+apaEsc(data.message||'')+'</div>'; return; }
    var results=data.results||[];
    if(!results.length){ box.innerHTML='<div class="empty">ไม่พบบัญชีที่ตรงกับคำค้นนี้</div>'; return; }
    box.innerHTML='';
    results.forEach(function(acc){ box.appendChild(apaAccountCard(acc)); });
    if(data.truncated){ box.innerHTML += '<div class="empty">⚠️ ผลลัพธ์เยอะเกิน 30 รายการ แสดงแค่บางส่วน ลองค้นให้เจาะจงกว่านี้</div>'; }
  }).catch(function(){ box.innerHTML='<div class="empty">ค้นหาไม่สำเร็จ เช็ค URL/เน็ต</div>'; });
}

function apaLoadDuplicates(){
  var box=document.getElementById('dup-results');
  box.innerHTML='<div class="empty">กำลังสแกนบัญชีทั้งหมด อาจใช้เวลาสักครู่...</div>';
  apaCall('list_duplicate_candidates', {}).then(function(data){
    if(data.error){ box.innerHTML='<div class="empty">โหลดไม่สำเร็จ: '+apaEsc(data.error)+' '+apaEsc(data.message||'')+'</div>'; return; }
    var emailDup=data.email_duplicates||[]; var fpDup=data.fingerprint_duplicates||[];
    if(!emailDup.length && !fpDup.length){ box.innerHTML='<div class="empty">ไม่พบบัญชีที่น่าจะซ้ำกันตอนนี้ (สแกน '+apaEsc(data.scanned_users)+' บัญชี)</div>'; return; }
    var html='<p class="sub">สแกน '+apaEsc(data.scanned_users)+' บัญชี · '+apaEsc(data.note||'')+'</p>';
    if(emailDup.length){
      html+='<table><tr><th>อีเมลจริงที่ซ้ำกัน</th><th>user_id ที่พบ</th></tr>';
      emailDup.forEach(function(g){ html+='<tr><td>'+apaEsc(g.email)+'</td><td>'+g.user_ids.map(function(u){return '<span class="tag dup" style="cursor:pointer" data-uid="'+apaEsc(u)+'">'+apaEsc(u).slice(0,8)+'…</span>';}).join(' ')+'</td></tr>'; });
      html+='</table>';
    }
    if(fpDup.length){
      html+='<h2 style="font-size:14px;">อุปกรณ์เดียวกัน (fingerprint ซ้ำ — รวมเคส LINE ↔ provider อื่น)</h2>';
      html+='<table><tr><th>fingerprint</th><th>user_id ที่พบ</th><th>มีบัญชี LINE ปนไหม</th></tr>';
      fpDup.forEach(function(g){ html+='<tr><td>'+apaEsc(g.fingerprint).slice(0,16)+'…</td><td>'+g.user_ids.map(function(u){return '<span class="tag dup" style="cursor:pointer" data-uid="'+apaEsc(u)+'">'+apaEsc(u).slice(0,8)+'…</span>';}).join(' ')+'</td><td>'+(g.includes_line_account?'ใช่ ⚠️':'ไม่')+'</td></tr>'; });
      html+='</table>';
    }
    box.innerHTML=html;
    box.querySelectorAll('.tag.dup[data-uid]').forEach(function(el){
      el.onclick=function(){ apaLoadDetail(el.getAttribute('data-uid')); };
    });
  }).catch(function(){ box.innerHTML='<div class="empty">โหลดไม่สำเร็จ เช็ค URL/เน็ต</div>'; });
}

function apaLoadDetail(userId){
  var titleEl=document.getElementById('detail-title');
  var box=document.getElementById('detail');
  titleEl.style.display='block';
  box.innerHTML='<div class="empty">กำลังโหลด...</div>';
  window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
  apaCall('get_account_detail', {user_id:userId}).then(function(data){
    if(data.error){ box.innerHTML='<div class="empty">โหลดไม่สำเร็จ: '+apaEsc(data.error)+' '+apaEsc(data.message||'')+'</div>'; return; }
    var acc=data.account; var log=data.audit_log||[];
    var card=apaAccountCard(acc);
    card.querySelector('.btn-view').remove();

    var noteBox=document.createElement('div'); noteBox.className='noteBox';
    noteBox.innerHTML='<textarea id="note-text" placeholder="พิมพ์หมายเหตุ เช่น สงสัยเป็นบัญชีซ้ำกับ ... หรือ ติดต่อยืนยันตัวตนแล้ว"></textarea><button class="btn btn-note">📝 บันทึกหมายเหตุ</button>';
    var noteStatus=document.createElement('div'); noteStatus.className='status';
    noteBox.querySelector('.btn-note').onclick=function(){
      var note=document.getElementById('note-text').value.trim();
      if(!note){ alert('พิมพ์หมายเหตุก่อน'); return; }
      noteStatus.textContent='กำลังบันทึก...';
      apaCall('add_admin_note', {user_id:userId, note:note}).then(function(res){
        if(res.error){ noteStatus.textContent='❌ '+res.error+' '+(res.message||''); return; }
        noteStatus.textContent='✅ บันทึกแล้ว';
        document.getElementById('note-text').value='';
        apaLoadDetail(userId);
      }).catch(function(){ noteStatus.textContent='❌ บันทึกไม่สำเร็จ ลองใหม่'; });
    };
    card.appendChild(noteBox);
    card.appendChild(noteStatus);

    var logHtml='<h2 style="font-size:14px;">ประวัติ (audit log) — ล่าสุด '+log.length+' รายการ</h2>';
    if(!log.length){ logHtml+='<div class="empty">ยังไม่มีประวัติของบัญชีนี้</div>'; }
    else{
      logHtml+='<table><tr><th>เมื่อไร</th><th>เหตุการณ์</th><th>ช่องทาง</th><th>ใครทำ</th><th>รายละเอียด</th></tr>';
      log.forEach(function(row){
        var afterNote = row.after_state && row.after_state.note ? row.after_state.note : '';
        logHtml+='<tr><td>'+new Date(row.created_at).toLocaleString('zh-TW')+'</td><td>'+apaEsc(row.event_type)+'</td><td>'+apaEsc(row.provider||'-')+'</td><td>'+apaEsc(row.actor_type)+'</td><td>'+apaEsc(afterNote)+'</td></tr>';
      });
      logHtml+='</table>';
    }

    box.innerHTML='';
    box.appendChild(card);
    var logDiv=document.createElement('div'); logDiv.className='section'; logDiv.innerHTML=logHtml;
    box.appendChild(logDiv);
  }).catch(function(){ box.innerHTML='<div class="empty">โหลดไม่สำเร็จ เช็ค URL/เน็ต</div>'; });
}
</script>
</body>
</html>
