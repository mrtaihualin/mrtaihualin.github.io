stages:
  - verify

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

default:
  image: node:22-bookworm
  interruptible: true
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-15

variables:
  GIT_DEPTH: "0"

required-tests-and-write-set:
  stage: verify
  timeout: 15m
  script:
    - node scripts/tests-task-write-set.js
    - node scripts/check-task-write-set.js --gitlab
    - runuser -u postgres -- env PATH="/usr/lib/postgresql/15/bin:$PATH" node scripts/check-site.js
    - runuser -u postgres -- env PATH="/usr/lib/postgresql/15/bin:$PATH" node scripts/tests-phase1-free-gamification-db.mjs
